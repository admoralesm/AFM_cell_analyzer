[theme]
primaryColor = "#1f77b4"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#e8eef2"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
maxMessageSize = 200

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 500

[browser]
gatherUsageStats = false
